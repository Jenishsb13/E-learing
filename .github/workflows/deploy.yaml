name: FastAPI Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./E-learing-fastapi

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python code
        run: |
          python -m compileall .

      # -----------------------------
      # Docker
      # -----------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t jenishselvaraj/crud-app:v1.0.3 .

      - name: Push Docker image
        run: |
          docker push jenishselvaraj/crud-app:v1.0.3

      # -----------------------------
      # AWS EKS
      # -----------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Check EKS connection
        run: |
          kubectl get nodes

      # Pull/deploy the Docker image through Kubernetes
      - name: Deploy Docker image to EKS
        run: |
          kubectl set image deployment/crud-app \
            crud-app=jenishselvaraj/crud-app:v1.0.3 \
            -n elearning

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/crud-app \
            -n elearning

      - name: Check pods
        run: |
          kubectl get pods -n elearning
