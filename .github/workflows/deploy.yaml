name: FastAPI Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./E-learing-fastapi

    steps:

      # -----------------------------
      # Checkout
      # -----------------------------

      - name: Checkout code
        uses: actions/checkout@v4


      # -----------------------------
      # Setup Python
      # -----------------------------

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # -----------------------------
      # Install dependencies
      # -----------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # -----------------------------
      # Validate Python code
      # -----------------------------

      - name: Validate Python code
        run: |
          python -m compileall .


      # -----------------------------
      # Docker Hub Login
      # -----------------------------

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # -----------------------------
      # Build Docker Image
      # -----------------------------

      - name: Build Docker image
        run: |
          docker build -t jenishselvaraj/crud-app:v1.0.3 .


      # -----------------------------
      # Push Docker Image
      # -----------------------------

      - name: Push Docker image
        run: |
          docker push jenishselvaraj/crud-app:v1.0.3


      # -----------------------------
      # Configure AWS
      # -----------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      # -----------------------------
      # Configure kubectl for EKS
      # -----------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region ${{ secrets.AWS_REGION }} \
            --name ${{ secrets.EKS_CLUSTER_NAME }}


      # -----------------------------
      # Check EKS connection
      # -----------------------------

      - name: Check EKS connection
        run: |
          kubectl get nodes


      # -----------------------------
      # Deploy Kubernetes manifests
      # -----------------------------

      - name: Deploy to EKS
        run: |
          kubectl apply -f deployment.yaml
          kubectl apply -f service.yaml


      # -----------------------------
      # Update Docker image
      # -----------------------------

      - name: Update Docker image
        run: |
          kubectl set image deployment/crud-app \
            crud-app=jenishselvaraj/crud-app:v1.0.3 \
            -n elearning


      # -----------------------------
      # Wait for deployment
      # -----------------------------

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/crud-app \
            -n elearning


      # -----------------------------
      # Check deployment
      # -----------------------------

      - name: Check pods
        run: |
          kubectl get pods -n elearning


      # -----------------------------
      # Check service
      # -----------------------------

      - name: Check service
        run: |
          kubectl get svc -n elearning
