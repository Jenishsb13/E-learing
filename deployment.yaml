apiVersion: apps/v1
kind: Deployment

metadata:
  name: crud-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: crud-app

  template:
    metadata:
      labels:
        app: crud-app

    spec:
      containers:
        - name: crud-app
          image: jenishselvaraj/crud-app:v1.0.3

          ports:
            - containerPort: 8000
